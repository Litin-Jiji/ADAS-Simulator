name: ADAS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.docker.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest tests/ -v

  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend
        run: |
          docker build -f Dockerfile.backend \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/adas-backend:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/adas-backend:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/adas-backend:latest

      - name: Build and push frontend
        run: |
          docker build -f Dockerfile.frontend \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/adas-frontend:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/adas-frontend:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/adas-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: adas-backend
          resourceGroup: adas-rg
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/adas-backend:latest

      - name: Deploy frontend
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: adas-frontend
          resourceGroup: adas-rg
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/adas-frontend:latest
