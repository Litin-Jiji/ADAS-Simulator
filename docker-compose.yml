version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: adas-backend
    ports:
      - "8000:8000"
    volumes:
      - ./videos:/app/videos
      - ./outputs:/app/outputs
      - ./models:/app/models
    environment:
      - DEVICE=cpu
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: adas-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: adas-network
